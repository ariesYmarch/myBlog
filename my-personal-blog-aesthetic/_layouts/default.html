<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script>
    try {
      if (localStorage.getItem('theme') === 'dark' ||
          (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch(e) {}
  </script>
</head>
<body>
<header class="header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/#posts' | relative_url }}">Posts</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="다크모드 전환">☼</button>
    </nav>
  </div>
</header>
{{ content }}
<footer class="wrap footer">
  <span>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</span>
  <span>Built with Jekyll · GitHub Pages</span>
</footer>
<script src="{{ '/assets/main.js' | relative_url }}" defer></script>
</body>
</html>
